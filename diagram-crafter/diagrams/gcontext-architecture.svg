<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 880" role="img" aria-label="gcontext: runtimes do the reasoning, the agent folder keeps the state, the MCP server connects the two" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- diagram-crafter
archetype: pipeline-flow
claim: runtimes do the reasoning, the agent folder keeps the state, the MCP server connects the two
source: gcontext architecture description (framework README)
audience: developers meeting gcontext for the first time
date: 2026-08-16
notes: hand-crafted reference; the quality bar for this module. Accent top bars removed 2026-08-16 per design/layout.md (colored bars on cards are banned).
-->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1F2A44" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A6FF3"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8963C"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2FA45C"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A90A0"/>
    </marker>

    <!-- Lucide icons, 24x24, stroke-based -->
    <g id="i-bot" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
      <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
    </g>
    <g id="i-sparkles" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>
      <path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>
    </g>
    <g id="i-terminal" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19h8"/><path d="m4 17 6-6-6-6"/>
    </g>
    <g id="i-server" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/>
      <line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>
    </g>
    <g id="i-file" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
      <path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
    </g>
    <g id="i-plug" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22v-5"/><path d="M15 8V2"/><path d="M9 8V2"/>
      <path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/>
    </g>
    <g id="i-folder" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    </g>
    <g id="i-lock" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
  </defs>

  <rect width="1520" height="880" fill="#FAF8F3"/>

  <!-- Header -->
  <text x="70" y="72" font-size="36" font-weight="700" fill="#1F2A44">gcontext</text>
  <text x="70" y="106" font-size="18" fill="#6B7385">An agent is a folder of state, served over MCP. The runtime forgets between sessions. The folder does not.</text>

  <!-- ============ LEFT: runtimes ============ -->
  <g filter="url(#soft)">
    <rect x="70" y="170" width="330" height="470" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="100" y="222" font-size="21" font-weight="700" fill="#1F2A44">Runtimes</text>
  <text x="100" y="248" font-size="14" fill="#6B7385">do the reasoning, keep nothing</text>

  <!-- runtime chips -->
  <g>
    <rect x="100" y="280" width="270" height="84" rx="12" fill="#EEF3FE" stroke="#D4DFFB"/>
    <use href="#i-bot" transform="translate(122,300) scale(1.85)" stroke="#4A6FF3"/>
    <text x="182" y="316" font-size="16" font-weight="600" fill="#1F2A44">Claude Code</text>
    <text x="182" y="340" font-size="13" fill="#6B7385">terminal sessions</text>
  </g>
  <g>
    <rect x="100" y="380" width="270" height="84" rx="12" fill="#EEF3FE" stroke="#D4DFFB"/>
    <use href="#i-sparkles" transform="translate(122,400) scale(1.85)" stroke="#4A6FF3"/>
    <text x="182" y="416" font-size="16" font-weight="600" fill="#1F2A44">Claude Desktop</text>
    <text x="182" y="440" font-size="13" fill="#6B7385">chat sessions</text>
  </g>
  <g>
    <rect x="100" y="480" width="270" height="84" rx="12" fill="#EEF3FE" stroke="#D4DFFB"/>
    <use href="#i-terminal" transform="translate(122,500) scale(1.85)" stroke="#4A6FF3"/>
    <text x="182" y="516" font-size="16" font-weight="600" fill="#1F2A44">Codex / Cursor</text>
    <text x="182" y="540" font-size="13" fill="#6B7385">any MCP client</text>
  </g>
  <text x="100" y="612" font-size="13" font-style="italic" fill="#8A90A0">memory resets every session</text>

  <!-- ============ MIDDLE: server ============ -->
  <g filter="url(#soft)">
    <rect x="560" y="170" width="380" height="470" rx="18" fill="#FFFFFF"/>
  </g>
  <use href="#i-server" transform="translate(590,200) scale(1.6)" stroke="#E8963C"/>
  <text x="640" y="222" font-size="21" font-weight="700" fill="#1F2A44">gcontext server</text>
  <text x="640" y="248" font-size="14" fill="#6B7385">local HTTP, speaks MCP</text>

  <!-- tools block -->
  <text x="590" y="298" font-size="15" font-weight="600" fill="#1F2A44">7 tools</text>
  <g font-size="12.5" fill="#7A4A12">
    <rect x="590" y="312" width="86" height="28" rx="14" fill="#FDF1E1"/><text x="633" y="330" text-anchor="middle">read_file</text>
    <rect x="684" y="312" width="90" height="28" rx="14" fill="#FDF1E1"/><text x="729" y="330" text-anchor="middle">write_file</text>
    <rect x="782" y="312" width="72" height="28" rx="14" fill="#FDF1E1"/><text x="818" y="330" text-anchor="middle">list_dir</text>
    <rect x="590" y="348" width="62" height="28" rx="14" fill="#FDF1E1"/><text x="621" y="366" text-anchor="middle">grep</text>
    <rect x="660" y="348" width="94" height="28" rx="14" fill="#FDF1E1"/><text x="707" y="366" text-anchor="middle">run_script</text>
    <rect x="762" y="348" width="128" height="28" rx="14" fill="#FDF1E1"/><text x="826" y="366" text-anchor="middle">run_adhoc_script</text>
    <rect x="590" y="384" width="64" height="28" rx="14" fill="#FDF1E1"/><text x="622" y="402" text-anchor="middle">agent</text>
  </g>

  <!-- instructions block -->
  <g>
    <rect x="590" y="446" width="320" height="76" rx="12" fill="#FDF6EC" stroke="#F3E0C4"/>
    <use href="#i-file" transform="translate(608,462) scale(1.7)" stroke="#E8963C"/>
    <text x="662" y="478" font-size="15" font-weight="600" fill="#1F2A44">Instructions, two layers</text>
    <text x="662" y="500" font-size="13" fill="#6B7385">framework (ships in package) + agent.md</text>
  </g>

  <!-- resources block -->
  <g>
    <rect x="590" y="538" width="320" height="64" rx="12" fill="#FDF6EC" stroke="#F3E0C4"/>
    <text x="612" y="564" font-size="15" font-weight="600" fill="#1F2A44">Every file is a resource</text>
    <text x="612" y="586" font-size="13" fill="#6B7385">agent://&lt;name&gt;, gcontext://&lt;path&gt;</text>
  </g>

  <!-- ============ RIGHT: state folder ============ -->
  <!-- folder tab -->
  <g filter="url(#soft)">
    <path d="M1100 158 h132 a14 14 0 0 1 14 14 v10 h-160 v-10 a14 14 0 0 1 14-14 z" fill="#DFF3E6"/>
    <rect x="1086" y="180" width="364" height="460" rx="18" fill="#FFFFFF"/>
  </g>
  <use href="#i-folder" transform="translate(1112,206) scale(1.6)" stroke="#2FA45C"/>
  <text x="1162" y="228" font-size="21" font-weight="700" fill="#1F2A44">The agent itself</text>
  <text x="1162" y="254" font-size="14" fill="#6B7385">a plain folder of state, portable</text>

  <g>
    <rect x="1112" y="284" width="312" height="72" rx="12" fill="#EFF9F2" stroke="#CFEBD9"/>
    <use href="#i-plug" transform="translate(1130,302) scale(1.6)" stroke="#2FA45C"/>
    <text x="1180" y="314" font-size="15" font-weight="600" fill="#1F2A44">connections/</text>
    <text x="1180" y="336" font-size="13" fill="#6B7385">services it can use, and how</text>
  </g>
  <g>
    <rect x="1112" y="368" width="312" height="72" rx="12" fill="#EFF9F2" stroke="#CFEBD9"/>
    <use href="#i-folder" transform="translate(1130,386) scale(1.6)" stroke="#2FA45C"/>
    <text x="1180" y="398" font-size="15" font-weight="600" fill="#1F2A44">modules/</text>
    <text x="1180" y="420" font-size="13" fill="#6B7385">accumulated knowledge per topic</text>
  </g>
  <g>
    <rect x="1112" y="452" width="312" height="72" rx="12" fill="#EFF9F2" stroke="#CFEBD9"/>
    <use href="#i-terminal" transform="translate(1130,470) scale(1.6)" stroke="#2FA45C"/>
    <text x="1180" y="482" font-size="15" font-weight="600" fill="#1F2A44">scripts/</text>
    <text x="1180" y="504" font-size="13" fill="#6B7385">procedures that proved themselves</text>
  </g>
  <g>
    <rect x="1112" y="536" width="312" height="72" rx="12" fill="#FFF8F0" stroke="#F0DCC0" stroke-dasharray="5 4"/>
    <use href="#i-lock" transform="translate(1130,554) scale(1.6)" stroke="#C77E28"/>
    <text x="1180" y="566" font-size="15" font-weight="600" fill="#1F2A44">secrets.env</text>
    <text x="1180" y="588" font-size="13" fill="#6B7385">names visible, values never readable</text>
  </g>

  <!-- ============ Connections ============ -->
  <!-- runtimes -> server -->
  <path d="M400 330 C 470 330, 490 330, 552 330" fill="none" stroke="#4A6FF3" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="476" y="316" font-size="13" fill="#4A6FF3" text-anchor="middle">connect to a URL</text>

  <!-- server -> runtimes (instructions) -->
  <path d="M552 484 C 490 484, 470 484, 408 484" fill="none" stroke="#E8963C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="480" y="470" font-size="13" fill="#C77E28" text-anchor="middle">instructions injected</text>
  <text x="480" y="502" font-size="12" fill="#8A90A0" text-anchor="middle">at every handshake</text>

  <!-- server <-> folder -->
  <path d="M940 360 C 1010 360, 1020 360, 1078 360" fill="none" stroke="#2FA45C" stroke-width="2.5" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <text x="1010" y="346" font-size="13" fill="#2FA45C" text-anchor="middle">read, write, run</text>

  <!-- secrets -> tools -->
  <path d="M1104 572 C 1000 572, 980 420, 902 400" fill="none" stroke="#8A90A0" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-gray)"/>
  <text x="1006" y="560" font-size="12" fill="#8A90A0" text-anchor="middle">values injected at run time</text>

  <!-- ============ Bottom story strip ============ -->
  <g font-size="14" fill="#1F2A44">
    <circle cx="90" cy="720" r="14" fill="#4A6FF3"/>
    <text x="90" y="725" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="116" y="725">Any MCP runtime connects. No chat loop ships with gcontext.</text>

    <circle cx="600" cy="720" r="14" fill="#E8963C"/>
    <text x="600" y="725" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="626" y="725">The server only serves state. The runtime does the thinking.</text>

    <circle cx="1086" cy="720" r="14" fill="#2FA45C"/>
    <text x="1086" y="725" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1112" y="725">Copy the folder, move the agent. State is just files.</text>
  </g>

  <text x="70" y="800" font-size="13" fill="#8A90A0">Everything the agent knows and learns lives in the folder. Sessions end, files stay.</text>
</svg>
